<!DOCTYPE html>
<html>
<head>
    <title>Emergency QR System</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Library (IMPORTANT) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="container">

    <h2>Emergency QR System</h2>

    <input type="text" id="name" placeholder="Enter Name">
    <input type="text" id="blood" placeholder="Blood Group">
    <input type="text" id="contact" placeholder="Emergency Contact">

    <button onclick="generateQR()">Generate QR</button>
    <button onclick="downloadQR()">Save QR</button>

    <div id="qrcode"></div>

</div>

<script src="script.js"></script>

</body>
</html>
